# Cabeçalhos de segurança do SITE (a API já manda os seus via helmet).
# Incluído em cada `location` do nginx.conf — e não declarado uma vez no
# nível do server — porque no Nginx um add_header dentro de um location
# DESCARTA todos os add_header herdados do server, e os locations do site
# já têm o seu (Cache-Control). Declarado uma vez só lá em cima, nenhum
# destes cabeçalhos chegaria às páginas.
#
# Instalação: sudo cp deploy/hostinger/security-headers.conf /etc/nginx/snippets/clinica-security-headers.conf

# Content-Security-Policy — o que a página pode carregar:
#  - script: só do próprio domínio (nenhum script inline; ver
#    web/public/scroll-reset.js, que existe por isso).
#  - style: 'unsafe-inline' é necessário — o Vue aplica :style como atributo
#    inline e o GSAP anima escrevendo estilo inline em cada quadro.
#  - font/style externos: só Google Fonts.
#  - img: próprio domínio, data:/blob: (texturas SVG embutidas no CSS) e
#    https: (imagens de categoria podem ser um endereço https:// externo).
#  - frame: só o mapa do Google Maps da página de Contato.
#  - frame-ancestors 'none': ninguém embute o site num iframe (clickjacking
#    contra o painel administrativo).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HTTPS obrigatório por 1 ano (o navegador ignora este cabeçalho em HTTP,
# então é inofensivo antes do certbot configurar o HTTPS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
