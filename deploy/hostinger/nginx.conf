# Nginx da VPS — site (web/dist) e API (proxy para o pm2) no mesmo domínio.
#
# Instalação (ver DEPLOY.md, seção 5):
#   sudo cp deploy/hostinger/security-headers.conf /etc/nginx/snippets/clinica-security-headers.conf
#   sudo cp deploy/hostinger/nginx.conf /etc/nginx/sites-available/clinica
#   sudo ln -s /etc/nginx/sites-available/clinica /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d noelycerqueira.com.br -d www.noelycerqueira.com.br
#
# Troque "noelycerqueira.com.br" pelo domínio real antes de copiar. O certbot
# reescreve este arquivo sozinho para adicionar o bloco HTTPS (443) e o
# redirecionamento HTTP → HTTPS — não precisa escrever isso à mão.

server {
    listen 80;
    listen [::]:80;
    server_name noelycerqueira.com.br www.noelycerqueira.com.br;

    root /home/deploy/clinica/web/dist;
    index index.html;

    # Não anuncia a versão do Nginx nos cabeçalhos/páginas de erro.
    server_tokens off;

    # Fotos de paciente e extrato OFX vão em base64 no corpo JSON — a API
    # aceita até 10mb nessas rotas (ver UPLOAD_ROUTES em app.ts), aqui com
    # uma folga. As demais rotas a própria API limita a 100kb.
    client_max_body_size 12m;

    # API — "/api/agendamentos" chega no Express como "/agendamentos" (a
    # barra no fim do proxy_pass remove o prefixo). Por isso VITE_API_URL
    # em produção é "https://<domínio>/api". Os cabeçalhos de segurança da
    # API vêm do próprio Express (helmet).
    location /api/ {
        proxy_pass http://127.0.0.1:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Arquivos do build do Vite têm hash no nome — podem ficar em cache
    # "para sempre", um deploy novo gera nomes novos.
    location /assets/ {
        include /etc/nginx/snippets/clinica-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas do Vue Router (/servicos, /agendar, /admin/...) — equivalente ao
    # web/public/_redirects, que só vale em Netlify/Cloudflare Pages.
    location / {
        include /etc/nginx/snippets/clinica-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
