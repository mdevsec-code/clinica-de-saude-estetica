[build]
  command = "npm run build"
  publish = "dist"

# URL pública da API (VPS Hostinger, HTTPS no próprio IP — ver DEPLOY.md).
# Fica aqui, versionada, em vez de só no painel da Netlify: o Vite embute
# esse valor no bundle na hora do build, e definido aqui ele vale para todo
# deploy (e tem precedência sobre a variável de mesmo nome no painel).
[build.environment]
  VITE_API_URL = "https://179.236.83.106"

# Sem isto, abrir uma URL direto (ex.: recarregar a página em /servicos, ou
# compartilhar um link de /agendar) dá 404 — a Netlify tenta achar um
# arquivo físico "/servicos", que não existe (é uma rota do Vue Router,
# resolvida só depois do JavaScript carregar). Esta regra manda toda rota
# desconhecida pro index.html, que aí sim inicializa o Vue Router, que lê a
# URL real do navegador e renderiza a view certa.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
