services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noely
      POSTGRES_PASSWORD: noely
      POSTGRES_DB: noely_cerqueira
    ports:
      - "5432:5432"
    volumes:
      - noely_pg_data:/var/lib/postgresql/data

volumes:
  noely_pg_data:
